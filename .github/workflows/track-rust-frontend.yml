name: Track Rust Frontend upstream

on:
  schedule:
    - cron: "20 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare Issue 44280 and release signals with accepted snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_rust_frontend_tracking.py
