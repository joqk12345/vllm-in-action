<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4ED"/>
      <stop offset="1" stop-color="#E9F1F0"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#52656A" flood-opacity=".20"/>
    </filter>
    <marker id="arr2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#276B6B"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{font-size:48px;font-weight:750;fill:#15333A}
      .sub{font-size:21px;fill:#5C7479}
      .h{font-size:25px;font-weight:700;fill:#173840}
      .body{font-size:18px;fill:#36545A}
      .tag{font-size:16px;font-weight:650;fill:#276B6B}
      .tiny{font-size:15px;fill:#6E8286}
      .arrow{fill:none;stroke:#276B6B;stroke-width:3.5;marker-end:url(#arr2)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="94" y="91" class="sans title">Rust workspace：用层次承接变化</text>
  <text x="94" y="130" class="sans sub">边界从“协议”逐步收敛到“token 流”，再跨进程连接既有 engine</text>

  <g filter="url(#sh2)">
    <rect x="116" y="196" width="910" height="100" rx="18" fill="#FFFFFF" stroke="#B8CDCB" stroke-width="2"/>
    <rect x="116" y="196" width="22" height="100" rx="11" fill="#276B6B"/>
    <text x="168" y="238" class="sans h">01 · Server</text>
    <text x="168" y="270" class="sans body">OpenAI HTTP、内部 gRPC、路由与公共协议契约</text>
    <text x="844" y="250" class="mono tag">vllm-server</text>

    <rect x="166" y="320" width="860" height="100" rx="18" fill="#FFFFFF" stroke="#B8CDCB" stroke-width="2"/>
    <rect x="166" y="320" width="22" height="100" rx="11" fill="#3C8C85"/>
    <text x="218" y="362" class="sans h">02 · Chat</text>
    <text x="218" y="394" class="sans body">chat template、reasoning、tool calling、结构化事件</text>
    <text x="844" y="374" class="mono tag">vllm-chat</text>

    <rect x="216" y="444" width="810" height="100" rx="18" fill="#FFFFFF" stroke="#B8CDCB" stroke-width="2"/>
    <rect x="216" y="444" width="22" height="100" rx="11" fill="#5BA59B"/>
    <text x="268" y="486" class="sans h">03 · Text</text>
    <text x="268" y="518" class="sans body">tokenizer、增量 detokenizer、停止条件</text>
    <text x="844" y="498" class="mono tag">vllm-text</text>

    <rect x="266" y="568" width="760" height="100" rx="18" fill="#FFFFFF" stroke="#B8CDCB" stroke-width="2"/>
    <rect x="266" y="568" width="22" height="100" rx="11" fill="#7AB9AE"/>
    <text x="318" y="610" class="sans h">04 · LLM</text>
    <text x="318" y="642" class="sans body">稳定的 token-in / token-out 抽象</text>
    <text x="844" y="622" class="mono tag">vllm-llm</text>

    <rect x="316" y="692" width="710" height="100" rx="18" fill="#FFFFFF" stroke="#B8CDCB" stroke-width="2"/>
    <rect x="316" y="692" width="22" height="100" rx="11" fill="#98CBBF"/>
    <text x="368" y="734" class="sans h">05 · Engine Core Client</text>
    <text x="368" y="766" class="sans body">ZMQ、MessagePack、生命周期与输出分发</text>
    <text x="802" y="746" class="mono tag">vllm-engine-core-client</text>
  </g>

  <path d="M1076 246 C1184 246 1184 370 1076 370" class="arrow"/>
  <path d="M1076 370 C1204 370 1204 494 1076 494" class="arrow"/>
  <path d="M1076 494 C1184 494 1184 618 1076 618" class="arrow"/>
  <path d="M1076 618 C1204 618 1204 742 1076 742" class="arrow"/>

  <g>
    <rect x="1222" y="216" width="268" height="192" rx="18" fill="#15333A"/>
    <text x="1254" y="260" class="sans h" style="fill:#F7F4ED">变化落点</text>
    <text x="1254" y="299" class="sans body" style="fill:#D7E5E3">新 endpoint → Server</text>
    <text x="1254" y="332" class="sans body" style="fill:#D7E5E3">新模型语法 → Chat</text>
    <text x="1254" y="365" class="sans body" style="fill:#D7E5E3">新文本行为 → Text</text>
    <text x="1254" y="390" class="sans tiny" style="fill:#96B7B4">目标：不让适配分支渗入全链路</text>

    <rect x="1222" y="452" width="268" height="238" rx="18" fill="#FFF7DF" stroke="#E3BE63" stroke-width="2"/>
    <text x="1254" y="496" class="sans h">边界提醒</text>
    <text x="1254" y="537" class="sans body">• crate/API 会随 release 变化</text>
    <text x="1254" y="572" class="sans body">• 分层不等于 feature parity</text>
    <text x="1254" y="607" class="sans body">• 仍需端到端契约测试</text>
    <text x="1254" y="648" class="sans tiny">进入正文前固定 tag 与 commit</text>
  </g>
  <text x="94" y="850" class="sans tiny">证据：RF-C02 · SRC-vllm-rust-frontend-readme · 核对日期 2026-07-25</text>
</svg>
