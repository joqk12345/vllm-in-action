topic: rust-frontend
as_of: 2026-07-25
policy:
  body_ready_grades: [A, B]
  transcript_grade: D
  rule: "转写只发现问题；所有对外结论必须绑定 A/B 级来源、版本和边界。"
claims:
  - id: RF-C01
    statement: "Rust Frontend 替换北向 serving frontend，不重写 Python vLLM engine。"
    kind: upstream-fact
    grade: A
    applies_to: "vLLM 主仓 Rust frontend，核对至 2026-07-25"
    sources: [SRC-vllm-rust-frontend-rfc-40846, SRC-vllm-rust-frontend-roadmap-44280]
    chapters: ["03", "06"]
  - id: RF-C02
    statement: "workspace 通过 Server、Chat、Text、LLM、Engine Core Client 分层隔离协议、语义、文本、token 流和后端通信。"
    kind: upstream-fact
    grade: A
    applies_to: "官方 rust/ README；进入正文前固定 release tag"
    sources: [SRC-vllm-rust-frontend-readme]
    chapters: ["03", "06"]
  - id: RF-C03
    statement: "streaming 是主路径，非流式通过收集同一输出流构造，以减少双路径语义漂移。"
    kind: design-fact
    grade: B
    applies_to: "官方 README/设计说明；正确性仍需契约测试"
    sources: [SRC-vllm-rust-frontend-readme, SRC-rust-frontend-talk-2026]
    chapters: ["03", "06"]
  - id: RF-C04
    statement: "tool/reasoning parser 采用面向增量流的重构设计；新增模型应适配 Rust 设计而非逐行移植 Python。"
    kind: upstream-fact
    grade: A
    applies_to: "roadmap 对 parser 架构的说明；具体 parser 覆盖动态变化"
    sources: [SRC-vllm-rust-frontend-roadmap-44280, SRC-vllm-rust-frontend-readme]
    chapters: ["06", "14"]
  - id: RF-C05
    statement: "Rust frontend 可由 Python launcher 监管，并通过 VLLM_USE_RUST_FRONTEND=1 选择。"
    kind: upstream-fact
    grade: A
    applies_to: "RFC 与 roadmap 核对至 2026-07-25；部署前验证目标 release"
    sources: [SRC-vllm-rust-frontend-rfc-40846, SRC-vllm-rust-frontend-roadmap-44280]
    chapters: ["06", "15"]
  - id: RF-C06
    statement: "RFC benchmark 显示：当前端成为瓶颈时，单个 Rust frontend 可在特定压力测试中超过默认或扩容后的 Python frontend。"
    kind: benchmark-observation
    grade: A
    applies_to: "vLLM 0.19.0；Qwen3-0.6B；DP=4；4xGB200；concurrency=1024；request_rate=inf；未在本仓复现"
    sources: [SRC-vllm-rust-frontend-rfc-40846]
    chapters: ["09", "13"]
    invalid_generalization: "不能外推到大模型、低并发、GPU-bound 或其他硬件。"
  - id: RF-C07
    statement: "截至 2026-07-25，官方仍将 Rust frontend 标为 experimental 且未 feature-complete。"
    kind: upstream-status
    grade: A
    applies_to: "动态 roadmap 快照；引用前重查"
    sources: [SRC-vllm-rust-frontend-roadmap-44280, SRC-vllm-rust-frontend-readme]
    chapters: ["06", "14", "15"]
  - id: RF-C08
    statement: "生产采用必须通过 endpoint/parameter/ops 三级 capability contract，而不是依据启动成功或平均吞吐。"
    kind: engineering-judgment
    grade: B
    applies_to: "本书建议；由 roadmap 缺口和 RFC 边界推导"
    sources: [SRC-vllm-rust-frontend-roadmap-44280, SRC-vllm-rust-frontend-rfc-40846]
    chapters: ["06", "14", "15"]
  - id: RF-C09
    statement: "Rust 模块未来可复用于 gateway/router/control plane。"
    kind: hypothesis
    grade: D
    applies_to: "演讲方向性设想；不是已发布承诺"
    sources: [SRC-rust-frontend-talk-transcript-part-02]
    chapters: ["03", "15"]
    publication_rule: "只可放入未来方向或待验证问题，不得写成现有能力。"
