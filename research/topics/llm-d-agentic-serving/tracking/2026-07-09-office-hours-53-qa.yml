    category: deployment-operator
    question: "llm-d 是否支持 gang scheduling？资源不齐时是否不会启动相关 prefill/decode 组件？"
    speaker_answer: "llm-d 项目本身不包含 deployment API，对服务器如何部署保持 unopinionated；可与 Deployment、NVIDIA Grove、LeaderWorkerSet 或其他 scheduler/operator 组合。复杂 PD 版本滚动需要避免选择不同 vLLM 版本的 pod；社区有 disaggregated set operator 等工作。"
