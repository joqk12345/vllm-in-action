status: draft
policy:
  body_ready_grades: [A, B]
  production_claim_requires:
    - fixed_vllm_release_or_commit
    - fixed_model_config_or_hf_revision
    - commands_and_raw_logs
    - hardware_and_workload_manifest
  notes: "Paper results are author-reported unless reproduced in this repository. C/D sources are discovery only."

statuses:
  roadmap_status:
    checked: "Observed in an upstream roadmap, RFC, blog, or merged-main integration signal."
    unchecked: "No upstream status check recorded."
    discussion-required: "State is ambiguous or still under active design."
  release_status:
    verified: "Merge commit and first containing stable release/tag are established and inspected."
    unverified: "Implementation may exist on main or in a special image, but stable release boundary is not established."
    not-in-target: "Capability is absent from the named target release."
  local_test_status:
    passed: "Repository contains a reproducible passing test for the stated workload."
    failed: "Repository contains a reproducible failing test."
    partial: "Only part of the workload or correctness surface passed."
    not-run: "No local reproducible run is recorded."

capabilities:
  - id: kimi-k3-model-main
    layer: parameter-model
    capability: "KimiK3ForConditionalGeneration model registration and Kimi K3 model/kernel integration"
    roadmap_status: checked
    release_status: unverified
    local_test_status: not-run
    required_for: [model_load, multimodal_serve, kda_mla_execution]
    chapters: ["08", "11", "12", "15"]
    source_ids: [SRC-vllm-kimi-k3-support-pr-50000, SRC-vllm-kimi-k3-day0-blog-2026-07-27]
    fixed_commit: aeeb36b1f17145975c6713242f2447bb8b98782b
    target_release_boundary: "not in v0.26.0; first stable release unverified"
    dependency_boundary: "PR note requires FlashInfer v0.6.16rc5 and vllm/vllm-openai:kimi-k3 image"

  - id: hybrid-kda-mla-cache
    layer: operations
    capability: "Joint allocation, scheduling, lifecycle, and hit-boundary coordination for MLA KV and KDA recurrent state"
    roadmap_status: checked
    release_status: unverified
    local_test_status: not-run
    required_for: [prefix_caching, long_context_prefill, pd_disaggregation]
    chapters: ["04", "08", "11", "13", "15"]
    source_ids: [SRC-kimi-k3-tech-report-2026-07-28, SRC-vllm-kimi-k3-support-pr-50000, SRC-vllm-kimi-k3-day0-blog-2026-07-27]
    risks: [state_kv_boundary_mismatch, large_physical_block, stale_state_on_reuse, pd_tail_zeroing_race]

  - id: hybrid-partial-prefix-hit
    layer: operations
    capability: "Fine-grained prefix lookup inside a larger physical hybrid-cache block using hash_block_size, aliases, explicit hit length, and copy-on-write"
    roadmap_status: discussion-required
    release_status: unverified
    local_test_status: not-run
    required_for: [agentic_prefix_reuse, system_prompt_reuse, turn_boundary_reuse]
    chapters: ["04", "08", "11", "13", "15"]
    source_ids: [SRC-vllm-partial-cache-rfc-45702, SRC-vllm-kimi-k3-support-pr-50000]
    merged_prs:
      - "#45939@6bc6f2d86d7800f878a4a13495b51a6e3b728c37"
      - "#46384@481e481be786c1ca3229e26aa34c15ffd22375af"
      - "#49502@d74285661064541f12be14e49a16defa27de67c6"
    open_design: [final_tail_checkpointing, same_step_reuse]

  - id: kimi-k3-dspark-low-latency
    layer: endpoint
    capability: "Kimi K3 DSpark speculative decoding for low-concurrency decode"
    roadmap_status: checked
    release_status: unverified
    local_test_status: not-run
    required_for: [single_user_low_latency]
    chapters: ["09", "11", "12", "15"]
    source_ids: [SRC-vllm-kimi-k3-day0-blog-2026-07-27, SRC-vllm-kimi-k3-support-pr-50000]
    author_reported_baseline: "GB300 NVL72, batch size 1: TP8 111→331 tok/s/user; TP16 118→370 tok/s/user"
    risks: [acceptance_rate_workload_sensitivity, kda_state_rejection_correctness, batch_size_speedup_decay]

methods:
  - id: glm5-dsa
    family: dynamic_sparse_attention
    primary_sources: [SRC-glm5-paper-v2]
    evidence_grade: B
    model_or_project: GLM-5
    architecture_claim: "DSA dynamic sparse selection, indexer/top-k components, plus KV reuse/routing discussion."
    vllm_status: unknown
    current_state: captured
    chapters: ["04", "09", "11", "12", "15"]
    risks:
      - indexer_topk_overhead
      - deterministic_selection
      - kernel_availability
      - quality_regression_on_non_ruler_tasks
    next_steps:
      - "Capture DeepSeek NSA/DSA primary paper and implementation."
      - "Check vLLM support for GLM-5/DSA or related sparse kernels."

  - id: gated-deltanet
    family: linear_recurrent_gated_delta
    primary_sources: [SRC-gated-deltanet-paper-v3, SRC-deltanet-explained-part-ii]
    evidence_grade: B
    model_or_project: Gated DeltaNet / GDN
    architecture_claim: "Combines gating-based forgetting with delta-rule targeted updates; supports chunkwise parallel training."
    vllm_status: background_for_qwen_gdn
    current_state: tables_extracted_needs_pdf_review
    chapters: ["09", "11", "12"]
    risks:
      - finite_state_memory
      - table_ocr_needs_review
      - training_results_not_serving_results
    next_steps:
      - "Review PDF tables manually."
      - "Capture NVlabs/GatedDeltaNet repo commit."

  - id: kimi-linear-kda
    family: hybrid_linear_kda
    primary_sources:
