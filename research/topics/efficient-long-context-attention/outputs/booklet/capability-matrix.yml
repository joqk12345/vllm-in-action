      - "Fix Kimi K3/DSpark HF revisions, image digest and FlashInfer dependency."
      - "Confirm first stable vLLM release containing PR #50000."
      - "Run partial-hit, eviction/reuse, PD transfer and DSpark rejection correctness tests."
      - "Separate model-quality benchmark claims from serving-system design claims."

