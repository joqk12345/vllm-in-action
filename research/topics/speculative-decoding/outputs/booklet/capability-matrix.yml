statuses:
  roadmap_status:
    checked: "已在 roadmap、README、演讲或讨论中观察到，但不代表 release。"
    unchecked: "未观察到或未检查。"
    discussion-required: "需要进一步上游讨论或解释。"
  release_status:
    unverified: "尚未绑定固定 release/tag/commit 或未检查目标版本。"
    verified: "已确认 merge commit 与目标 release/tag 中的源码/测试/文档。"
    not-in-target: "已确认不在目标版本。"
  local_test_status:
    not-run: "本仓未运行复现实验或 smoke test。"
    passed: "本仓有可复现实验通过。"
    failed: "本仓实验失败。"
    partial: "只完成部分场景。"
